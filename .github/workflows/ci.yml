name: Aegis CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Environment doctor
        run: npm run doctor
      - name: Zero-dependency lint
        run: npm run verify:zero-deps
      - name: Claims wording
        run: npm run verify:claims
      - name: Module test suite
        run: npm test
      # dist/ is git-ignored, so a clean checkout has no archive to verify.
      # Build it first, then verify — same pair ci-runtime.yml runs.
      - name: Delivery integrity (B-03)
        run: |
          npm run pack:delivery
          npm run verify:delivery

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: P3 browser gate
        run: node scripts/verify-p3-browser.mjs
