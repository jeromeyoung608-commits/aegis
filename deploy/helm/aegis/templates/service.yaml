apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }} }
spec:
  selector: { app: {{ .Release.Name }} }
  ports: [{ port: {{ .Values.service.port }}, targetPort: {{ .Values.service.targetPort }} }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ .Release.Name }}-data, namespace: {{ .Release.Namespace }} }
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
---
apiVersion: v1
kind: Secret
metadata: { name: {{ .Release.Name }}-secrets, namespace: {{ .Release.Namespace }} }
type: Opaque
stringData:
  AEGIS_ISSUER_SECRET: {{ .Values.auth.issuerSecret | quote }}
  AEGIS_OIDC_CLIENT_SECRET: {{ .Values.auth.oidcClientSecret | quote }}
