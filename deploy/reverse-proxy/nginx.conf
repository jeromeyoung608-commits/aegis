# Aegis — nginx reverse proxy with TLS + security headers.
# Terminate TLS here (or use certbot to obtain a cert) and proxy to the Aegis
# backend on 127.0.0.1:8080. nginx should run on the same host as the container
# / systemd service (which binds to localhost).
server {
    listen 80;
    server_name aegis.example;
    # ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name aegis.example;

    ssl_certificate     /etc/letsencrypt/live/aegis.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegis.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (mirror the app's own; defense in depth)
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 50m;   # allow large asset uploads

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
